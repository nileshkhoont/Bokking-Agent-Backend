[project]
name = "ai-calling-agent-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length not worth hard-wrapping. B008: FastAPI's Depends()-in-default is the
# standard, intended pattern for this framework, not a real bug.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
