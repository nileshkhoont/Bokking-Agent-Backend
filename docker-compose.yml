services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # MONGODB_URI is intentionally NOT overridden here — it comes from .env (MongoDB Atlas), the
  # same database the API (run directly on the host via uvicorn) and the admin dashboard use.
  # Overriding it per-service to point at local/container-only Mongo instances was the root cause
  # of scheduled calls silently never dispatching: the schedule got created in Atlas, but the
  # worker was polling an empty local database and never saw it.
  api:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis

  # Run with: docker compose up -d --build redis celery_worker celery_beat flower
  # (deliberately not `docker compose up -d` alone, which would also start the unused `mongo`
  # container below — kept only as an opt-in local fallback, nothing points at it by default).
  celery_worker:
    build: .
    command: celery -A app.workers.celery_app worker -l info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis

  celery_beat:
    build: .
    command: celery -A app.workers.celery_app beat -l info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis

  # Queue dashboard — http://localhost:5555. Only needs the Redis broker, no MongoDB access.
  flower:
    build: .
    command: celery -A app.workers.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis

volumes:
  mongo_data:
