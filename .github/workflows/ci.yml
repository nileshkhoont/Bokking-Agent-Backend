name: Backend CI

on:
  push:
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: mypy src
        continue-on-error: true
      - run: pytest
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB_NAME: ai_calling_agent_test
          JWT_SECRET_KEY: ci-test-secret
          AGENT_TOOL_SECRET: ci-test-tool-secret
